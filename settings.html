<!DOCTYPE html>
<!-- Settings window markup: buddy and to-do switches, AI setup, current
     activity and quit. Behaviour lives in settings.js, styles in settings.css. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buddy settings</title>
  <!-- The buddy's theme (colours, fonts, spacing), shared with the avatar. -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="settings">
    <h1 class="settings-title">Settings</h1>

    <!-- Things shown on screen -->
    <section class="settings-group" aria-labelledby="onScreenHeading">
      <h2 class="group-heading" id="onScreenHeading">On screen</h2>
      <div class="card">
        <label class="setting-row">
          <span class="setting-text">
            <span class="setting-label">Show the buddy</span>
            <span class="setting-hint" id="avatarHint">The frog on your screen. To pause it for a while, use Snooze in its menu.</span>
          </span>
          <input type="checkbox" role="switch" class="switch" id="avatarToggle" aria-describedby="avatarHint">
        </label>
        <label class="setting-row">
          <span class="setting-text">
            <span class="setting-label">To-do list</span>
            <span class="setting-hint" id="todoHint">Pins a small task list to the bottom-right corner.</span>
          </span>
          <input type="checkbox" role="switch" class="switch" id="todoToggle" aria-describedby="todoHint">
        </label>
        <label class="setting-row">
          <span class="setting-text">
            <span class="setting-label">Show Pomodoro timer</span>
            <span class="setting-hint" id="studyTimerHint">Shows the countdown and controls above the frog while a Pomodoro runs. Hiding it does not stop the timer.</span>
          </span>
          <input type="checkbox" role="switch" class="switch" id="studyTimerToggle" aria-describedby="studyTimerHint">
        </label>
      </div>
    </section>

    <!-- Appearance: theme and how see-through the buddy's messages are -->
    <section class="settings-group" aria-labelledby="appearanceHeading">
      <h2 class="group-heading" id="appearanceHeading">Appearance</h2>
      <div class="card">
        <label class="field appearance-field">
          <span class="field-label">Theme</span>
          <select class="field-input" id="themeSelect">
            <option value="system">Match system</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label class="field appearance-field">
          <span class="field-label field-label-row">
            Message opacity
            <output class="range-value" id="opacityValue" for="opacityRange"></output>
          </span>
          <input type="range" class="range" id="opacityRange" aria-describedby="opacityHint">
          <span class="setting-hint" id="opacityHint">How solid the buddy's messages and menus are: 100% is fully solid. Lower is more see-through, which can be harder to read on busy backgrounds.</span>
        </label>
      </div>
    </section>

    <!-- AI: one section for every AI feature -->
    <section class="settings-group" aria-labelledby="aiHeading">
      <h2 class="group-heading" id="aiHeading">AI</h2>
      <div class="card">
        <label class="setting-row">
          <span class="setting-text">
            <span class="setting-label">
              Enable AI
              <span class="badge" id="aiBadge"></span>
            </span>
            <span class="setting-hint" id="aiHint">Powers the buddy chat, splitting goals into subtasks, and sorting unknown apps.</span>
          </span>
          <input type="checkbox" role="switch" class="switch" id="aiToggle" aria-describedby="aiHint">
        </label>

        <div class="ai-fields" id="aiFields">
          <label class="field">
            <span class="field-label">Provider</span>
            <select class="field-input" id="aiProvider"></select>
          </label>
          <label class="field" id="aiBaseUrlRow">
            <span class="field-label">Endpoint</span>
            <input type="text" class="field-input" id="aiBaseUrl" spellcheck="false">
          </label>
          <label class="field">
            <span class="field-label">Model</span>
            <input type="text" class="field-input" id="aiModel" spellcheck="false" list="aiModelHints">
            <datalist id="aiModelHints"></datalist>
          </label>
          <label class="field" id="aiApiKeyRow">
            <span class="field-label">API key</span>
            <input type="password" class="field-input" id="aiApiKey" spellcheck="false" autocomplete="off" aria-describedby="aiKeyHint">
          </label>
          <p class="setting-hint" id="aiKeyHint"></p>
          <p class="ai-status" id="aiStatus" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <!-- What the buddy currently thinks the user is doing -->
    <section class="settings-group" aria-labelledby="activityHeading">
      <h2 class="group-heading" id="activityHeading">Current activity</h2>
      <div class="card">
        <p class="activity" id="activityStatus" aria-live="polite">Detecting…</p>
      </div>
    </section>

    <footer class="settings-footer">
      <button type="button" class="button-secondary" id="quitBtn">Quit the buddy</button>
      <p class="setting-hint">Closes the frog, the to-do list and the tray icon.</p>
    </footer>
  </main>
  <script src="settings.js"></script>
</body>
</html>
