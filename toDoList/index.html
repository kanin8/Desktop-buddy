<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>To-do</title>
<style>
:root{--bg:#e6ecf1;--panel:#f8fafb;--ink:#14263a;--muted:#6b7c8d;--line:#d3dce4;--accent:#0f8b7a;--accent-ink:#fff;--danger:#b4423a}
@media (prefers-color-scheme:dark){:root{--bg:#0e1822;--panel:#16232f;--ink:#e6eef5;--muted:#8a9bab;--line:#263646;--accent:#2fbfa9;--accent-ink:#06231f;--danger:#e0776e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--panel);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Ubuntu,Cantarell,sans-serif;font-size:14px;overflow:hidden}
#app{border:1px solid var(--accent);padding:10px 14px 12px}
header{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
h1{font-size:16px;margin:0;font-weight:700}
#count{color:var(--muted);flex:1}
button{font:inherit;cursor:pointer}
.icon{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.icon:hover{color:var(--ink)}
form{display:flex;gap:6px;margin-bottom:8px}
input[type=text]{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=text]::placeholder{color:var(--muted)}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:0 14px;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#list{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto}
li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:0;border:2px solid var(--muted);border-radius:6px;cursor:pointer;display:grid;place-content:center}
li input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
li input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.t{flex:1;overflow-wrap:anywhere;line-height:1.35}
li.done .t{color:var(--muted);text-decoration:line-through}
.del:hover{color:var(--danger)}
.empty{color:var(--muted);padding:10px 2px;display:block}
.foot{display:flex;justify-content:flex-end;margin-top:6px}
.clear{background:none;border:0;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:6px}
.clear:hover{color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>To-do</h1>
    <span id="count" aria-live="polite"></span>
    <button class="icon" id="collapse" type="button" aria-label="Collapse" title="Collapse">&ndash;</button>
    <button class="icon" id="quit" type="button" aria-label="Quit" title="Quit">&times;</button>
  </header>
  <section id="body">
    <form id="f">
      <input type="text" id="in" placeholder="Add a task" aria-label="New task" autocomplete="off" maxlength="200" autofocus>
      <button class="add" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <div class="foot"><button class="clear" id="clear" type="button" hidden>Clear completed</button></div>
  </section>
</div>
<script src="renderer.js"></script>
</body>
</html>
