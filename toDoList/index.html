<!DOCTYPE html>
<!-- To-do panel markup and styles. Task tree + reordering logic lives in renderer.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>To-do</title>
<!-- The buddy's theme (colours, fonts, spacing), shared with the avatar. -->
<link rel="stylesheet" href="../styles/tokens.css">
<style>
/* ============================
   To-do list — variables
   ============================
   The panel's own short names, pointing at the buddy's theme tokens in
   styles/tokens.css so the panel matches the rest of the app. Change the
   look there, not here. Always dark for now, like the buddy; a light mode
   only needs a second set of theme values. */
:root{--bg:var(--field-bg);--panel:var(--panel-bg);--ink:var(--text-primary);--muted:var(--text-secondary);--line:var(--divider);--accent-ink:var(--accent-text);--indent:var(--todo-indent)}

/* ============================
   To-do list — base and layout
   ============================ */
*{box-sizing:border-box}
html,body{margin:0;background:var(--panel);color:var(--ink);font-family:var(--font);font-size:var(--font-size-md);overflow:hidden}
#app{border:var(--border-width) solid var(--surface-border);padding:var(--space-3) var(--space-4) var(--space-3)}
header{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
h1{font-size:var(--font-size-lg);margin:0;font-weight:700}
#count{color:var(--muted);flex:1}

/* ============================
   To-do list — buttons and add form
   ============================ */
button{font:inherit;cursor:pointer}
.icon{display:inline-flex;align-items:center;justify-content:center;background:none;border:0;color:var(--muted);font-size:var(--icon-glyph-size);line-height:1;padding:var(--space-half) var(--space-2);border-radius:var(--radius-sm)}
.icon:hover{color:var(--ink)}
/* The maximize square rides inside the row: centered horizontally by the
   button's flex, so it matches the – and × next to it. */
.icon svg{display:block}
form{display:flex;gap:var(--space-2);margin-bottom:var(--space-2)}
input[type=text]{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:var(--border-width) solid var(--line);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-3)}
input[type=text]::placeholder{color:var(--muted)}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--radius-pill);padding:0 var(--space-4);font-weight:600}
.add:hover{background:var(--accent-hover)}
:focus-visible{outline:var(--focus-ring-width) solid var(--focus-ring);outline-offset:var(--space-half)}

/* ============================
   To-do list — task rows
   ============================ */
#list{list-style:none;margin:0;padding:0;max-height:var(--todo-list-max-height);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--scrollbar-thumb) transparent}
/* flex-wrap lets a parent task carry a second line (its subtasks toggle) inside
   the same li, so the drag/drop logic still sees one row per task. */
li{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);row-gap:var(--space-1);padding:var(--space-2) var(--space-half);border-top:var(--border-width) solid var(--line)}
li:first-child{border-top:0}
li input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:var(--checkbox-size);height:var(--checkbox-size);margin:0;border:var(--space-half) solid var(--muted);border-radius:var(--radius-sm);cursor:pointer;display:grid;place-content:center}
li input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
/* The tick: an L shape (two borders) turned 45°. Its size is drawn to fit
   the checkbox, so it stays in px. */
li input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 var(--space-half) var(--space-half) 0;transform:rotate(45deg) translate(-1px,-1px)}
.t{flex:1;overflow-wrap:anywhere;line-height:var(--line-height)}
li.done .t{color:var(--muted);text-decoration:line-through}
.del:hover{color:var(--danger)}
.empty{color:var(--muted);padding:var(--space-3) var(--space-half);display:block}

/* ============================
   To-do list — footer
   ============================ */
.foot{display:flex;gap:var(--space-2);justify-content:flex-end;margin-top:var(--space-2)}
.clear{background:none;border:0;color:var(--muted);font-size:var(--font-size-sm);padding:var(--space-half) var(--space-2);border-radius:var(--radius-sm)}
.clear:hover{color:var(--ink)}
/* !important so [hidden] always wins over a display set by a class (e.g.
   .empty's display:block); otherwise hidden elements would still show. */
[hidden]{display:none!important}

/* ============================
   To-do list — finished tasks group
   ============================ */

/* Completed top-level tasks collect under a collapsible "Done (n)" header at
   the bottom of the list. The header is one line in the list, styled like the
   rows around it (same padding, same text size), but idles muted, keeps no
   hover highlight, and the whole line is one button so it is easy to hit. The caret reuses the row chevron mask and rotates open like
   theirs on aria-expanded. */
.done-group{
  border-top:var(--border-width) solid var(--line);
  padding:var(--space-2) var(--space-half);
}
.done-toggle{
  display:flex;
  align-items:center;
  gap:var(--space-2);
  width:100%;
  padding:0;
  background:none;
  border:0;
  color:var(--muted);
  border-radius:var(--radius-sm);
  transition:background-color var(--transition-fast),color var(--transition-fast);
}
/* No hover highlight on this row: the group idles muted even under the
   pointer (the button stays clickable); placed after the generic :hover rule
   in the sheet anyway, in case that rule ever starts matching these too. */
.done-toggle:hover{
  color:var(--muted);
  background:none;
}

.done-toggle:focus-visible{
  color:var(--ink);
}
.done-toggle[aria-expanded="true"] .twisty::before{
  transform:rotate(90deg);
}
.done-label{
  font-size:var(--font-size-md);
}

/* ============================
   To-do list — subtask progress
   ============================ */

/* "Subtasks n/x", n subtasks done of x total. Plain muted text riding the
   disclosure line (see below); no pill of its own any more, now that it no
   longer has to fit on the parent's own line. */
.progress{
  color:var(--muted);
  font-size:var(--font-size-sm);
  font-variant-numeric:tabular-nums;
}
li.done .progress{
  opacity:var(--done-opacity);
}

/* ============================
   To-do list — parent disclosure line
   ============================ */

/* The parent keeps only checkbox, text and delete on its own line; the
   disclosure sits on a second line inside the same li, directly under the
   parent task and above the subtask rows. The arrow starts in one line with
   the subtask checkboxes (indented one level past the half-checkbox base) and
   "Subtasks n/x" follows it. The line wraps inside the same li, so the row's
   drag/drop zones stay intact. */
.twist-line{
  flex-basis:100%;
  display:flex;
  align-items:center;
  gap:var(--space-2);
  padding-left:-12px;
}

/* ============================
   To-do list — task tree
   ============================ */

/* Subtasks are indented by --depth, which render.js writes on each row. */
li.item{
  position:relative;
  padding-left:calc(var(--space-half) + var(--depth,0) * var(--indent));
  transition:background-color var(--transition-fast) ease,opacity var(--transition-fast) ease;
}
li.item[draggable=true]{
  cursor:grab;
  user-select:none;
}

/* ============================
   To-do list — subtask disclosure
   ============================ */

/* The disclosure button is a full 24x24 clickable field with its own hover,
   so the small arrow does not ask for precise aiming. The arrow is the
   Firefox-style chevron (twisty.svg) used as a mask, so the glyph follows
   the button's colour on hover and stays small inside the field. The glyph
   is drawn symmetric in the SVG, so rotating the element spins the tip from
   right (collapsed) to down (expanded) with no offset needed. */
.twisty{
  flex:none;
  width:var(--twisty-size);
  height:var(--twisty-size);
  padding:0;
  display:grid;
  place-items:center;
  background:none;
  border:0;
  color:var(--muted);
  line-height:1;
  border-radius:var(--radius-sm);
  transition:background-color var(--transition-fast),color var(--transition-fast);
}
.twisty:hover{
  color:var(--ink);
  background:var(--surface-hover);
}
.twisty::before{
  content:"";
  width:var(--space-3);
  height:var(--space-3);
  background-color:currentColor;
  -webkit-mask:url("twisty.svg") center / contain no-repeat;
          mask:url("twisty.svg") center / contain no-repeat;
  transition:transform var(--transition-fast);
}
.twisty[aria-expanded="true"]::before{
  transform:rotate(90deg);
}

/* ============================
   To-do list — teal flash
   ============================ */

/* One-shot highlight so a task drawing attention once when it arrives or
   completes: the row starts in the accent tint and fades back. The class is
   added for a single render and consumed there, so a re-render (reorder,
   drag) never replays it. Rows are rebuilt each render, which restages the
   animation on fresh nodes, so no reflow tricks are needed. */
li.item.is-flash{
  animation:flash var(--flash-duration) ease-out;
}
@keyframes flash{
  from{background-color:var(--accent-tint)}
  to{background-color:transparent}
}

/* ============================
   To-do list — drag and drop states
   ============================ */

li.item.is-dragging{
  opacity:var(--dragging-opacity);
  cursor:grabbing;
}
li.item.drag-over{
  background:var(--accent-tint);
}
/* The extra padding keeps the row height steady when the marker is added. */
li.item.drag-over[data-insert-mode=before]{
  border-top:var(--focus-ring-width) solid var(--accent);
  padding-top:calc(var(--space-2) - var(--border-width));
}
li.item.drag-over[data-insert-mode=after]{
  border-bottom:var(--focus-ring-width) solid var(--accent);
  padding-bottom:calc(var(--space-2) - var(--border-width));
}
/* Middle-zone drop: the task becomes the last subtask of the highlighted row. */
li.item.drag-over[data-insert-mode=childLast]{
  box-shadow:inset var(--focus-ring-width) 0 0 var(--accent);
}

/* ============================
   To-do list — keyboard reorder states
   ============================ */

li.item:focus-visible{
  outline:var(--focus-ring-width) solid var(--focus-ring);
  outline-offset:calc(-1 * var(--focus-ring-width));
  border-radius:var(--radius-sm);
}
li.item.is-grabbed{
  outline:var(--focus-ring-width) dashed var(--accent);
  outline-offset:calc(-1 * var(--focus-ring-width));
  background:var(--accent-tint);
}

/* ============================
   To-do list — screen reader announcements
   ============================
   The standard "visually hidden" pattern: the 1px values are what keeps it
   readable by screen readers while invisible, so they stay as they are. */

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  margin:-1px;
  padding:0;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>To-do</h1>
    <span id="count" aria-live="polite"></span>
    <button class="icon" id="collapse" type="button" aria-label="Collapse" title="Collapse">&ndash;</button>
    <button class="icon" id="quit" type="button" aria-label="Quit" title="Quit">&times;</button>
  </header>
  <section id="body">
    <form id="f">
      <input type="text" id="in" placeholder="Add a task" aria-label="New task" autocomplete="off" maxlength="200" autofocus>
      <button class="add" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <div class="foot">
      <button class="clear" id="undo" type="button" hidden>Undo last AI insert</button>
      <button class="clear" id="clear" type="button" hidden>Clear completed</button>
    </div>
  </section>
  <div id="sr" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
<script src="renderer.js"></script>
</body>
</html>
