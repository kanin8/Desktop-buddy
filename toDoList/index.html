<!DOCTYPE html>
<!-- To-do panel markup and styles. Task tree + reordering logic lives in renderer.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>To-do</title>
<!-- The buddy's theme (colours, fonts, spacing), shared with the avatar. -->
<link rel="stylesheet" href="../styles/tokens.css">
<style>
/* ============================
   To-do list — variables
   ============================
   The panel's own short names, pointing at the buddy's theme tokens in
   styles/tokens.css so the panel matches the rest of the app. Change the
   look there, not here. Always dark for now, like the buddy; a light mode
   only needs a second set of theme values. */
:root{--bg:var(--field-bg);--panel:var(--panel-bg);--ink:var(--text-primary);--muted:var(--text-secondary);--line:var(--divider);--accent-ink:var(--accent-text);--indent:var(--space-4)}

/* ============================
   To-do list — base and layout
   ============================ */
*{box-sizing:border-box}
html,body{margin:0;background:var(--panel);color:var(--ink);font-family:var(--font);font-size:var(--font-size-md);overflow:hidden}
#app{border:var(--border-width) solid var(--surface-border);padding:var(--space-3) var(--space-4) var(--space-3)}
header{display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-2)}
h1{font-size:var(--font-size-lg);margin:0;font-weight:700}
#count{color:var(--muted);flex:1}

/* ============================
   To-do list — buttons and add form
   ============================ */
button{font:inherit;cursor:pointer}
.icon{background:none;border:0;color:var(--muted);font-size:var(--icon-glyph-size);line-height:1;padding:var(--space-half) var(--space-2);border-radius:var(--radius-sm)}
.icon:hover{color:var(--ink)}
form{display:flex;gap:var(--space-2);margin-bottom:var(--space-2)}
input[type=text]{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:var(--border-width) solid var(--line);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-3)}
input[type=text]::placeholder{color:var(--muted)}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--radius-pill);padding:0 var(--space-4);font-weight:600}
.add:hover{background:var(--accent-hover)}
:focus-visible{outline:var(--focus-ring-width) solid var(--focus-ring);outline-offset:var(--space-half)}

/* ============================
   To-do list — task rows
   ============================ */
#list{list-style:none;margin:0;padding:0;max-height:var(--todo-list-max-height);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--scrollbar-thumb) transparent}
li{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-half);border-top:var(--border-width) solid var(--line)}
li:first-child{border-top:0}
li input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:var(--checkbox-size);height:var(--checkbox-size);margin:0;border:var(--space-half) solid var(--muted);border-radius:var(--radius-sm);cursor:pointer;display:grid;place-content:center}
li input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
/* The tick: an L shape (two borders) turned 45°. Its size is drawn to fit
   the checkbox, so it stays in px. */
li input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 var(--space-half) var(--space-half) 0;transform:rotate(45deg) translate(-1px,-1px)}
.t{flex:1;overflow-wrap:anywhere;line-height:var(--line-height)}
li.done .t{color:var(--muted);text-decoration:line-through}
.del:hover{color:var(--danger)}
.empty{color:var(--muted);padding:var(--space-3) var(--space-half);display:block}

/* ============================
   To-do list — footer
   ============================ */
.foot{display:flex;gap:var(--space-2);justify-content:flex-end;margin-top:var(--space-2)}
.clear{background:none;border:0;color:var(--muted);font-size:var(--font-size-sm);padding:var(--space-half) var(--space-2);border-radius:var(--radius-sm)}
.clear:hover{color:var(--ink)}
/* !important so [hidden] always wins over a display set by a class (e.g.
   .empty's display:block); otherwise hidden elements would still show. */
[hidden]{display:none!important}

/* ============================
   To-do list — subtask progress
   ============================ */

.progress{
  flex:none;
  color:var(--muted);
  font-size:var(--font-size-sm);
  font-variant-numeric:tabular-nums;
  padding:var(--border-width) var(--space-2);
  border:var(--border-width) solid var(--line);
  border-radius:var(--radius-pill);
}
li.done .progress{
  opacity:var(--done-opacity);
}

/* ============================
   To-do list — task tree
   ============================ */

/* Subtasks are indented by --depth, which render.js writes on each row. */
li.item{
  padding-left:calc(var(--space-half) + var(--depth,0) * var(--indent));
  transition:background-color var(--transition-fast) ease,opacity var(--transition-fast) ease;
}
li.item[draggable=true]{
  cursor:grab;
  user-select:none;
}

/* ============================
   To-do list — subtask disclosure
   ============================ */

.twisty{
  flex:none;
  width:var(--icon-size);
  height:var(--checkbox-size);
  padding:0;
  background:none;
  border:0;
  color:var(--muted);
  font-size:var(--font-size-sm);
  line-height:1;
  border-radius:var(--radius-sm);
}
.twisty:hover{
  color:var(--ink);
}

/* ============================
   To-do list — drag and drop states
   ============================ */

li.item.is-dragging{
  opacity:var(--dragging-opacity);
  cursor:grabbing;
}
li.item.drag-over{
  background:var(--accent-tint);
}
/* The extra padding keeps the row height steady when the marker is added. */
li.item.drag-over[data-insert-mode=before]{
  border-top:var(--focus-ring-width) solid var(--accent);
  padding-top:calc(var(--space-2) - var(--border-width));
}
li.item.drag-over[data-insert-mode=after]{
  border-bottom:var(--focus-ring-width) solid var(--accent);
  padding-bottom:calc(var(--space-2) - var(--border-width));
}
/* Middle-zone drop: the task becomes the last subtask of the highlighted row. */
li.item.drag-over[data-insert-mode=childLast]{
  box-shadow:inset var(--focus-ring-width) 0 0 var(--accent);
}

/* ============================
   To-do list — keyboard reorder states
   ============================ */

li.item:focus-visible{
  outline:var(--focus-ring-width) solid var(--focus-ring);
  outline-offset:calc(-1 * var(--focus-ring-width));
  border-radius:var(--radius-sm);
}
li.item.is-grabbed{
  outline:var(--focus-ring-width) dashed var(--accent);
  outline-offset:calc(-1 * var(--focus-ring-width));
  background:var(--accent-tint);
}

/* ============================
   To-do list — screen reader announcements
   ============================
   The standard "visually hidden" pattern: the 1px values are what keeps it
   readable by screen readers while invisible, so they stay as they are. */

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  margin:-1px;
  padding:0;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>To-do</h1>
    <span id="count" aria-live="polite"></span>
    <button class="icon" id="collapse" type="button" aria-label="Collapse" title="Collapse">&ndash;</button>
    <button class="icon" id="quit" type="button" aria-label="Quit" title="Quit">&times;</button>
  </header>
  <section id="body">
    <form id="f">
      <input type="text" id="in" placeholder="Add a task" aria-label="New task" autocomplete="off" maxlength="200" autofocus>
      <button class="add" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <div class="foot">
      <button class="clear" id="undo" type="button" hidden>Undo last AI insert</button>
      <button class="clear" id="clear" type="button" hidden>Clear completed</button>
    </div>
  </section>
  <div id="sr" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
<script src="renderer.js"></script>
</body>
</html>
