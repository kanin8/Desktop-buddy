<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avatar PoC</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      width: 100vw;
      height: 100vh;
    }
    #avatar {
      position: absolute;
      width: 40px;
      height: 40px;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #speech-bubble {
      position: absolute;
      background: white;
      border: 2px solid black;
      border-radius: 10px;
      padding: 8px 12px;
      font-family: sans-serif;
      font-size: 12px;
      color: black;
      max-width: 200px;
      display: none;
      z-index: 100;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      pointer-events: none;
    }
    #speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 20px;
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: white transparent;
      display: block;
      width: 0;
    }
    .bird-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .wing {
      transition: transform 0.1s ease-in-out;
      transform-origin: center;
    }
  </style>
</head>
<body>
  <div id="avatar">
  </div>
  <div id="speech-bubble"></div>
  <script src="overlay.js"></script>
</body>
</html>
