<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avatar PoC</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="controls/controls.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      width: 100vw;
      height: 100vh;
    }
    #avatar {
      position: absolute;
      width: var(--avatar-box-width);
      height: var(--avatar-box-height);
      /* Stops a drag from selecting things or scrolling instead of moving. */
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* ============================
       Avatar — sprite animation
       ============================
       The sprite element is sized and positioned per-frame by
       spriteAnimator.js, so only the fixed rules live here. */
    #avatar-sprite {
      flex: 0 0 auto;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    /* ============================
       Speech bubble
       ============================
       Navy glass bubble above the frog, used by the spelling and bedtime
       messages. overlay.js shows/hides it (display) and positions it.
       All values come from styles/tokens.css. */
    #speech-bubble {
      position: absolute;
      z-index: 100;
      display: none;
      /* Sized by its text alone. Without this the bubble wraps narrower
         the closer it gets to the right edge, which shifts it again. */
      width: max-content;
      max-width: var(--bubble-max-width);
      padding: var(--space-2) var(--space-3);
      border: var(--border-width) solid var(--surface-border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: var(--font-size-md);
      line-height: var(--line-height);
      color: var(--text-primary);
      background-color: var(--surface);
      box-shadow: var(--surface-shadow);
      backdrop-filter: blur(var(--surface-blur));
      pointer-events: none;
    }

    /* The tail: a small square turned 45° so one rounded corner points down
       at the frog. Only its lower half is drawn (clip-path), so the
       see-through navy isn't doubled where it overlaps the bubble.
       overlay.js sets --bubble-tail-x so it sits above the frog's middle. */
    #speech-bubble::after {
      content: '';
      position: absolute;
      bottom: calc(var(--bubble-tail-size) / -2);
      left: var(--bubble-tail-x, var(--space-5));
      width: var(--bubble-tail-size);
      height: var(--bubble-tail-size);
      border-right: var(--border-width) solid var(--surface-border);
      border-bottom: var(--border-width) solid var(--surface-border);
      border-bottom-right-radius: var(--bubble-tail-radius);
      background-color: var(--surface);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
      transform: translateX(-50%) rotate(45deg);
    }

    /* ============================
       Avatar — hover affordance
       ============================ */

    /* The affordance that appears above the avatar on hover. It is the only
       clickable thing on the overlay besides the chat itself, so it opts back
       into pointer events while the pointer is over the avatar. */
    #bubble-option {
      position: absolute;
      background: white;
      border: 2px solid black;
      border-radius: 999px;
      padding: 6px 14px;
      font-family: sans-serif;
      font-size: 12px;
      color: black;
      white-space: nowrap;
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 100;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    #bubble-option::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 24px;
      border-width: 9px 9px 0;
      border-style: solid;
      border-color: white transparent;
      display: block;
      width: 0;
    }
    #bubble-option:hover,
    #bubble-option:focus-visible {
      background: #f0f4f7;
    }

    /* ============================
       Avatar — AI chat panel
       ============================ */

    #chat-panel {
      position: absolute;
      width: 280px;
      background: white;
      border: 2px solid black;
      border-radius: 12px;
      font-family: sans-serif;
      font-size: 12px;
      color: black;
      display: none;
      flex-direction: column;
      z-index: 101;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.25);
    }
    #chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #e2e8ee;
      font-weight: 700;
    }
    #chat-close {
      background: none;
      border: 0;
      font: inherit;
      cursor: pointer;
      color: #6b7c8d;
      padding: 0 4px;
      border-radius: 4px;
    }
    #chat-close:hover {
      color: black;
    }
    #chat-log {
      padding: 8px 10px;
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #chat-log:empty::before {
      content: 'Describe a goal and I will break it into steps.';
      color: #6b7c8d;
    }
    .chat-entry {
      border-radius: 8px;
      padding: 6px 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .chat-entry.user {
      background: #eef2f6;
      align-self: flex-end;
      max-width: 85%;
    }
    .chat-entry.buddy {
      background: #f6fbf9;
      align-self: flex-start;
      max-width: 92%;
    }
    .chat-entry.error {
      background: #fdecea;
      color: #8d2f28;
      align-self: flex-start;
    }
    .chat-entry.pending {
      color: #6b7c8d;
      font-style: italic;
    }
    #chat-form {
      display: flex;
      gap: 6px;
      padding: 8px;
      border-top: 1px solid #e2e8ee;
    }
    #chat-input {
      flex: 1;
      min-width: 0;
      font: inherit;
      padding: 6px 8px;
      border: 1px solid #cbd5dd;
      border-radius: 8px;
    }
    #chat-send {
      background: #0f8b7a;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 0 12px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #chat-send:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>
  <div id="avatar">
    <div id="avatar-sprite"></div>
    <!-- Decorative hint for now; step 3 makes it part of the keyboard-reachable controls. -->
    <div id="hover-indicator" class="hover-indicator" aria-hidden="true"></div>
  </div>
  <div id="speech-bubble"></div>
  <button id="bubble-option" type="button">Ask the buddy</button>
  <div id="chat-panel" role="dialog" aria-label="Ask the buddy to break down a task">
    <div id="chat-head">
      <span>Ask the buddy</span>
      <button id="chat-close" type="button" aria-label="Close chat">&times;</button>
    </div>
    <div id="chat-log" role="log" aria-live="polite" aria-relevant="additions text"></div>
    <form id="chat-form">
      <input type="text" id="chat-input" aria-label="Describe a goal" placeholder="I need to write my thesis" maxlength="200" autocomplete="off">
      <button id="chat-send" type="submit">Send</button>
    </form>
  </div>
  <script src="avatar/config.js"></script>
  <script src="avatar/spriteAnimator.js"></script>
  <script src="controls/config.js"></script>
  <script src="controls/avatarPosition.js"></script>
  <script src="controls/drag.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
