<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avatar PoC</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="controls/controls.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      width: 100vw;
      height: 100vh;
    }
    #avatar {
      position: absolute;
      width: var(--avatar-box-width);
      height: var(--avatar-box-height);
      /* Stops a drag from selecting things or scrolling instead of moving. */
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* ============================
       Avatar — sprite animation
       ============================
       The sprite element is sized and positioned per-frame by
       spriteAnimator.js, so only the fixed rules live here. */
    #avatar-sprite {
      flex: 0 0 auto;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    /* ============================
       Speech bubble
       ============================
       Navy glass bubble above the frog, used by the spelling and bedtime
       messages. overlay.js shows/hides it (display) and positions it.
       All values come from styles/tokens.css. */
    #speech-bubble {
      position: absolute;
      z-index: 100;
      display: none;
      /* Sized by its text alone. Without this the bubble wraps narrower
         the closer it gets to the right edge, which shifts it again. */
      width: max-content;
      max-width: var(--bubble-max-width);
      padding: var(--space-2) var(--space-3);
      border: var(--border-width) solid var(--surface-border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: var(--font-size-md);
      line-height: var(--line-height);
      color: var(--text-primary);
      background-color: var(--surface);
      box-shadow: var(--surface-shadow);
      backdrop-filter: blur(var(--surface-blur));
      pointer-events: none;
    }

    /* The tail: a small square turned 45° so one rounded corner points down
       at the frog. Only its lower half is drawn (clip-path), so the
       see-through navy isn't doubled where it overlaps the bubble.
       overlay.js sets --bubble-tail-x so it sits above the frog's middle. */
    #speech-bubble::after {
      content: '';
      position: absolute;
      bottom: calc(var(--bubble-tail-size) / -2);
      left: var(--bubble-tail-x, var(--space-5));
      width: var(--bubble-tail-size);
      height: var(--bubble-tail-size);
      border-right: var(--border-width) solid var(--surface-border);
      border-bottom: var(--border-width) solid var(--surface-border);
      border-bottom-right-radius: var(--bubble-tail-radius);
      background-color: var(--surface);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
      transform: translateX(-50%) rotate(45deg);
    }
  </style>
</head>
<body>
  <div id="avatar">
    <div id="avatar-sprite"></div>
    <!-- Decorative hint for now; step 3 makes it part of the keyboard-reachable controls. -->
    <div id="hover-indicator" class="hover-indicator" aria-hidden="true"></div>
  </div>
  <div id="speech-bubble"></div>
  <script src="avatar/config.js"></script>
  <script src="avatar/spriteAnimator.js"></script>
  <script src="controls/config.js"></script>
  <script src="controls/avatarPosition.js"></script>
  <script src="controls/drag.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
