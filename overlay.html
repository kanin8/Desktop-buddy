<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avatar PoC</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="controls/controls.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      width: 100vw;
      height: 100vh;
    }
    #avatar {
      position: absolute;
      width: var(--avatar-box-width);
      height: var(--avatar-box-height);
      /* Stops a drag from selecting things or scrolling instead of moving. */
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* ============================
       Avatar — sprite animation
       ============================
       The sprite element is sized and positioned per-frame by
       spriteAnimator.js, so only the fixed rules live here. */
    #avatar-sprite {
      flex: 0 0 auto;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    #speech-bubble {
      position: absolute;
      background: white;
      border: 2px solid black;
      border-radius: 10px;
      padding: 8px 12px;
      font-family: sans-serif;
      font-size: 12px;
      color: black;
      max-width: 200px;
      display: none;
      z-index: 100;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      pointer-events: none;
    }
    #speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 20px;
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: white transparent;
      display: block;
      width: 0;
    }
  </style>
</head>
<body>
  <div id="avatar">
    <div id="avatar-sprite"></div>
    <!-- Decorative hint for now; step 3 makes it part of the keyboard-reachable controls. -->
    <div id="hover-indicator" class="hover-indicator" aria-hidden="true"></div>
  </div>
  <div id="speech-bubble"></div>
  <script src="avatar/config.js"></script>
  <script src="avatar/spriteAnimator.js"></script>
  <script src="controls/config.js"></script>
  <script src="controls/avatarPosition.js"></script>
  <script src="controls/drag.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
